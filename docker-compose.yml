version: '3.8'

services:
  # ─────────────────────────────────────────────────────────
  # Backend Services
  # ─────────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=${DATABASE_URL:-sqlite:///jobs.db}
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - dev
      - prod

  # ─────────────────────────────────────────────────────────
  # Database Services
  # ─────────────────────────────────────────────────────────
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-actura_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-actura_pass}
      POSTGRES_DB: ${POSTGRES_DB:-actura_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-actura_user} -d ${POSTGRES_DB:-actura_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    profiles:
      - prod
      - postgres-dev

  # ─────────────────────────────────────────────────────────
  # Frontend Services
  # ─────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      args:
        - VITE_API_URL=http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - backend
    profiles:
      - dev
      - prod

volumes:
  postgres_data:
